<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ atu.nom }} — Page introuvable</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
    <div class="container">
        <div class="logo-area" style="display: flex; align-items: center; gap: 14px;">
            <img src="{{ url_for('static', filename='Designer.png') }}" alt="Atlantis Transport Union" style="height: 48px; width: 48px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-color); background: #fff;">
            <div>
                <h1>{{ atu.nom }} <span>[{{ atu.tag }}]</span></h1>
            </div>
        </div>
        <nav>
            <a href="/">Accueil</a>
            <a href="/actifs">Actifs</a>
            <a href="/lignes">Réseau</a>
            <a href="/carte">Carte & GPS</a>
            <a href="/classement">Classement</a>
            <a href="/factures">Trésorerie</a>
            <a href="/recrutement">Recrutement</a>
        </nav>
    </div>
</header>
    
    <main class="container" style="text-align: center; padding: 80px 20px;">
        <div class="hero">
            <h2>Erreur 404 — Hors-Piste !</h2>
            <p>La route que tu essaies d'emprunter n'existe pas ou a été déplacée.</p>
            <a href="/" class="btn">Retourner à l'accueil</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 {{ atu.nom }} — Conçu par {{ atu.auteur }}</p>
    </footer>
</body>
</html>
